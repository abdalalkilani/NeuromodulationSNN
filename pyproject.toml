[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromod-snn"
version = "0.1.0"
description = "Compact paper-facing code for neuromodulated spiking neural networks."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.20",
  "h5py>=3.0",
  "torch>=1.12",
]

[tool.setuptools]
packages = ["neuromod_snn"]
